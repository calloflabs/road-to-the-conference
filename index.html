<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>학회 가는 길 (Road to the Conference)</title>
<meta name="description" content="교수님을 모시고 세션 시작 전까지 학회장에 도착하는 복셀 3D 레이싱. Drive your professor to the conference before the session starts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(22,22,22,.62);
  --ink:#ffffff;
  --shade:#3f3f3f;
  --gold:#ffe14d;
  --grass:#6fb04a;
  --danger:#ff5a4a;
  --bg:#8fd3ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(10,10,10,.72);--bg:#8fd3ff;}}
:root[data-theme="dark"]{--panel:rgba(10,10,10,.72);--bg:#8fd3ff;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.panel{background:var(--panel);border:3px solid #111;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.45)}
.sh{text-shadow:2px 2px 0 var(--shade)}

#hud{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:620px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;
  display:flex;flex-direction:column;gap:5px;z-index:3;opacity:0;transition:opacity .3s}
#hud.on{opacity:1}
.row{display:flex;gap:8px;align-items:stretch}
.mood{flex:1;display:flex;align-items:center;gap:8px;padding:3px 8px}
#face{font-size:22px;line-height:1}
.lbl{font-size:12px;opacity:.9;line-height:1}
.bar{height:9px;background:#2a2a2a;border:2px solid #111;margin-top:3px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:#58d14e;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:width .2s}
.timer{padding:3px 10px;text-align:right;min-width:92px;display:flex;flex-direction:column;justify-content:center}
#timer{font-size:22px;line-height:1}
#timer.danger{color:var(--danger);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.track{display:flex;align-items:center;gap:6px;padding:2px 8px;font-size:14px;background:none;border:none;box-shadow:none}
.rail{flex:1;height:7px;background:#5b3b22;border:2px solid #111;position:relative}
.rail i{position:absolute;inset:0 auto 0 0;background:var(--grass)}
.rail b{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:15px;font-weight:normal}
#bubble{align-self:center;background:rgba(255,255,255,.72);color:#1a1a1a;border:2px solid rgba(17,17,17,.7);padding:4px 10px;font-size:17px;line-height:1.25;
  max-width:84%;text-align:center;position:relative;text-shadow:none;transform:scale(.6);opacity:0;transition:transform .15s,opacity .15s;
  box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#bubble.on{transform:scale(1);opacity:1}
#bubble em{font-style:normal;display:inline;font-size:12px;color:#7a5a2a;margin-right:6px}

#speed{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:6px 12px;font-size:22px;z-index:3;opacity:0;transition:opacity .3s}
#speed.on{opacity:1}
#speed.boost{color:var(--gold)}
#pause{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;font-size:20px;width:44px;height:44px;
  color:#fff;cursor:pointer;padding:0;display:none}
#pause.on{display:block}
#hud .row{padding-right:52px}
.menu{display:grid;gap:10px;margin-top:6px}
.menu .btn{min-width:0;width:100%}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);text-align:center;font-size:24px;z-index:3;
  pointer-events:none;opacity:0;transition:opacity .5s}
#hint.on{opacity:1;animation:sway 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
#toast{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#toast b{display:block;font-size:clamp(34px,9vw,54px);font-weight:normal;color:var(--gold);text-shadow:3px 3px 0 #3f2a00}
#toast span{font-size:20px}
#flash{position:fixed;inset:0;background:#ff2a2a;opacity:0;pointer-events:none;z-index:2;transition:opacity .25s}

.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.45));overflow-y:auto;touch-action:pan-y}
.screen.hidden{display:none}
.card{width:100%;max-width:400px;text-align:center;padding:24px 20px 22px;position:relative}
.sub{font-size:18px;color:#d8f0c8;margin:0}
h1{margin:4px 0 14px;font-weight:normal;font-size:clamp(40px,11vw,62px);line-height:1;color:var(--gold);
  text-shadow:4px 4px 0 #6b4a00,6px 6px 0 rgba(0,0,0,.35);letter-spacing:1px}
.desc{font-size:19px;line-height:1.45;margin:0 0 14px}
.how{display:grid;gap:6px;text-align:left;font-size:17px;background:rgba(0,0,0,.3);border:2px solid #111;padding:10px 12px;margin-bottom:18px}
.btn{font:inherit;font-size:25px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#8b8b8b;border:3px solid #111;
  box-shadow:inset 3px 3px 0 #bdbdbd,inset -3px -4px 0 #555;padding:12px 30px;cursor:pointer;min-width:220px}
.btn.sm{font-size:19px;padding:8px 16px;min-width:0}
.btn:hover,.btn:focus-visible{background:#6f8ad8;box-shadow:inset 3px 3px 0 #a9b8f0,inset -3px -4px 0 #3e4f93;outline:none}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.best{margin-top:12px;font-size:17px;color:#ffe9a0}
.langbtn{position:absolute;top:10px;right:10px;font:inherit;font-size:15px;color:#fff;background:rgba(0,0,0,.4);border:2px solid #111;padding:4px 10px;cursor:pointer}
.rt{margin:0 0 6px;font-weight:normal;font-size:clamp(34px,9.5vw,48px);color:var(--gold);text-shadow:3px 3px 0 #6b4a00}
.quote{font-size:19px;background:#fff;color:#222;border:3px solid #111;padding:10px 12px;margin:10px 0 14px;line-height:1.4;text-shadow:none}
.quote em{font-style:normal;display:block;font-size:13px;color:#7a5a2a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.stats div{background:rgba(0,0,0,.3);border:2px solid #111;padding:6px}
.stats small{display:block;font-size:14px;opacity:.85}
.stats strong{font-weight:normal;font-size:24px}
.score{font-size:22px;margin-bottom:12px}
.score strong{font-weight:normal;color:var(--gold);font-size:30px}
.submit{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.submit input{font:inherit;font-size:19px;padding:8px 10px;width:150px;border:3px solid #111;background:#fff;color:#111;text-shadow:none;
  -webkit-user-select:text;user-select:text}
.submit input:focus{outline:3px solid var(--gold)}
.status{font-size:15px;color:#ffe9a0;min-height:20px;margin-bottom:8px}
.lb{text-align:left;max-height:52vh;overflow-y:auto;background:rgba(0,0,0,.3);border:2px solid #111;padding:6px 8px;margin:10px 0;
  -webkit-overflow-scrolling:touch}
.lb table{width:100%;border-collapse:collapse;font-size:17px}
.lb td{padding:4px 4px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap}
.lb td:nth-child(2){width:100%;white-space:normal;overflow-wrap:anywhere}
.lb td.r{text-align:right;color:var(--gold)}
.lb tr.me td{background:rgba(255,225,77,.18)}
.lb .tag{font-size:12px;padding:1px 5px;border:1px solid #111;margin-left:4px;background:#2e7d32;color:#fff;text-shadow:none}
.lb .tag.f{background:#8b3a3a}
.lb .empty{padding:14px;text-align:center;opacity:.8}
@media (prefers-reduced-motion:reduce){#hint.on,#timer.danger{animation:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="flash"></div>

<div id="hud">
  <div class="row">
    <div class="panel mood sh"><span id="face">😄</span><div style="flex:1"><div class="lbl" id="moodLbl"></div><div class="bar"><i id="moodBar" style="width:100%"></i></div></div></div>
    <div class="panel timer sh"><div class="lbl" id="timerLbl"></div><div id="timer">2:00</div></div>
  </div>
  <div class="panel track sh"><span>🏫</span><div class="rail"><i id="prog" style="width:0"></i><b id="carMark" style="left:0">🚙</b></div><span>🎤</span></div>
  <div id="bubble"><em></em><span id="bubbleTxt"></span></div>
</div>
<div id="speed" class="panel sh">0 km/h</div>
<button id="pause" class="panel" aria-label="pause">⏸</button>
<div id="hint" class="sh"></div>
<div id="toast" class="sh"><b id="toastB"></b><span id="toastS"></span></div>

<div id="title" class="screen">
  <div class="card panel sh">
    <button class="langbtn" id="langBtn"></button>
    <p class="sub" id="tSub"></p>
    <h1 id="tTitle"></h1>
    <p class="desc" id="tDesc"></p>
    <div class="how" id="tHow"></div>
    <button class="btn" id="startBtn"></button>
    <div class="btnrow"><button class="btn sm" id="rankBtn"></button></div>
    <div class="best" id="bestT"></div>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="card panel sh">
    <h2 class="rt" id="rTitle"></h2>
    <div class="quote"><em id="rQuoteLbl"></em><span id="rQuote"></span></div>
    <div class="stats">
      <div><small id="sTimeLbl"></small><strong id="sTime"></strong></div>
      <div><small id="sMoodLbl"></small><strong id="sMood"></strong></div>
      <div><small id="sHitsLbl"></small><strong id="sHits"></strong></div>
      <div><small id="sCoffeeLbl"></small><strong id="sCoffee"></strong></div>
    </div>
    <div class="score"><span id="sScoreLbl"></span> <strong id="sScore"></strong><div class="best" id="sBest"></div></div>
    <div class="submit" id="submitRow"><input id="nameIn" maxlength="12" autocomplete="off"><button class="btn sm" id="submitBtn"></button></div>
    <div class="status" id="submitStatus"></div>
    <div class="btnrow"><button class="btn" id="againBtn"></button><button class="btn sm" id="rankBtn2"></button></div>
  </div>
</div>

<div id="pauseScr" class="screen hidden">
  <div class="card panel sh">
    <h2 class="rt" id="pTitle"></h2>
    <div class="menu">
      <button class="btn" id="resumeBtn"></button>
      <button class="btn" id="soundBtn"></button>
      <button class="btn" id="rankBtn3"></button>
      <button class="btn" id="quitBtn"></button>
    </div>
  </div>
</div>

<div id="rank" class="screen hidden">
  <div class="card panel sh">
    <h2 class="rt" id="lbTitle"></h2>
    <div class="lb" id="lbBody"></div>
    <div class="btnrow"><button class="btn sm" id="lbClose"></button></div>
  </div>
</div>

let AC = null, muted = false;
function snd(f, d=.12, type='square', v=.05, slide){
  if(muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, now);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, now + d);
    g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(.0001, now + d);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now + d);
  }catch(e){}
}

function rowGap(d){ return rand(19,28) - stageAt(d)*3; }
function spawnRow(d){
  const st=stageAt(d), z=-d;
  const pool = st===0 ? ['cone','cone','reviewer','cart','dewar','irb','squirrel','cat','chair']
             : st===1 ? ['goose','goose','cone','dewar','reviewer','irb','squirrel','squirrel','cat']
             : ['reviewer','cart','irb','dewar','goose','cone','reviewer','cat','chair','squirrel'];
  const type = pick(pool);
  if(type==='cone'){ const gap=rand(-3.2,3.2); for(let x=-5.4;x<=5.5;x+=1.35) if(Math.abs(x-gap)>2.2) mkCone(x,z); }
  else if(type==='goose'){ const n=Math.random()<.6?2:3; for(let i=0;i<n;i++) mkGoose(rand(-5,5), z-i*2.4); }
  else if(type==='squirrel'){ mkSquirrel(rand(-5,5), z); if(Math.random()<.4) mkSquirrel(rand(-5,5), z-3); }
  else if(type==='cat') mkCat(rand(-4,4), z);
  else if(type==='chair') mkChair(rand(-4,4), z);
  else if(type==='reviewer') mkReviewer(rand(-4.5,4.5), z);
  else if(type==='dewar'){ mkDewar(rand(-4.5,4.5), z); if(st===2 && Math.random()<.5) mkDewar(rand(-4.5,4.5), z-6); }
  else if(type==='cart') mkCart(rand(-3.5,3.5), z);
  else if(type==='irb') mkIrb(Math.random()<.5?-1:1, z);
  const r=Math.random();
  if(r<.11 && d>150) mkMail(rand(-4.5,4.5), z-9);
  else if(r<.32) mkPickup(Math.random()<.55?'coffee':'usb', rand(-4.5,4.5), z-9);
}

/* ================= STATE ================= */
let state='title', dist=0, speed=0, carX=0, targetX=0, mood=100, timeLeft=TIME_LIMIT, invuln=0, boost=0,
    hits=0, coffees=0, shake=0, stageIdx=-1, idleT=6, arriveT=0, hurrySaid=false, t=0,
    nextRow=70, nextNear=-40, nextFar=-40, nextLamp=-40, nextBoard=60, fovBase=60, power=null,
    lastResult=null, submitted=false;

function clearAll(){
  obstacles.forEach(o=>scene.remove(o.mesh)); obstacles.length=0;
  props.forEach(p=>scene.remove(p)); props.length=0;
  fx.forEach(f=>scene.remove(f.m)); fx.length=0;
}
function reset(){
  clearAll();
  dist=0; speed=0; carX=0; targetX=0; mood=100; timeLeft=TIME_LIMIT; invuln=0; boost=0; hits=0; coffees=0; shake=0;
  stageIdx=-1; idleT=7; arriveT=0; hurrySaid=false; power=null; car.userData.disco.visible=false; submitted=false; lastResult=null;
  nextRow=70; nextNear=-40; nextFar=-40; nextLamp=-40; nextBoard=60;
  car.position.set(0,0,0); car.rotation.set(0,0,0); car.visible=true;
  setSky(); streamWorld(); updateHUD();
}
function streamWorld(){
  const ahead = dist + 190;
  while(nextNear < ahead){ nearSlot(nextNear); nextNear += rand(7,11); }
  while(nextFar < ahead){ farSlot(nextFar); nextFar += rand(11,14); }
  while(nextLamp < ahead){ lamp(nextLamp); nextLamp += 24; }
  while(nextBoard < ahead){ if(nextBoard < TOTAL-80) billboard(nextBoard); nextBoard += rand(90,140); }
  if(state==='play') while(nextRow < dist + 150 && nextRow < TOTAL - 55){ spawnRow(nextRow); nextRow += rowGap(nextRow); }
  for(let i=props.length-1;i>=0;i--) if(props[i].position.z > -dist + 25){ scene.remove(props[i]); props.splice(i,1); }
  const cz = -dist;
  ground.position.set(0,0, Math.round((cz-100)/4)*4);
  walk.position.z = Math.round((cz-120)/4)*4;
  road.position.z = Math.round((cz-120)/4)*4;
}
const SKY_A = new THREE.Color('#8fd3ff'), SKY_B = new THREE.Color('#ffc38a'), skyTmp = new THREE.Color();
function setSky(){ skyTmp.copy(SKY_A).lerp(SKY_B, clamp(dist/TOTAL,0,1)*.85); scene.background.copy(skyTmp); scene.fog.color.copy(skyTmp); }

  state='play'; reset(); showPlayUI(true);
  $('hint').classList.add('on'); setTimeout(()=>$('hint').classList.remove('on'),3800);
  setTimeout(()=>say(T.startLine),400);
  BGM.tempo(155); BGM.start();
}
function hitObs(o){
  const m=o.mesh; mood=Math.max(0, mood-HIT_DMG[o.type]); hits++;
  o.hit=true; o.t=0;
  o.fly={vx:(m.position.x-carX>=0?1:-1)*rand(5,9), vy:rand(9,13), vz:-speed*.7-rand(2,6), rx:rand(-9,9), rz:rand(-9,9)};
  speed*=.35; invuln=1.1; shake=.55; flash();
  snd(120,.25,'sawtooth',.07,45); if(o.type==='goose') honk();
  if(o.type==='chair'){ say(pick(LINES.chair),T.chair); setTimeout(()=>{ if(state==='play') say(pick(LINES.chairProf)); },2700); idleT=12; }
  else { say(pick(LINES[o.type])); idleT=8; }
  if(mood<=0) finish('mood');
}
function smash(o){
  const m=o.mesh; o.hit=true; o.t=0;
  const rage = power && power.kind==='cut';
  o.fly={vx:(m.position.x-carX>=0?1:-1)*rand(rage?12:5,rage?20:9), vy:rand(rage?26:18,rage?36:26), vz:-speed-rand(6,14), rx:rand(-14,14), rz:rand(-14,14)};
  shake = Math.max(shake, rage?.45:.2);
  if(rage) snd(90,.3,'sawtooth',.09,30); else snd(rand(700,1100),.12,'triangle',.05,1800);
  if(o.type==='goose') honk();
}
function collect(o){
  o.collected=true; o.t=0;
  if(o.type==='coffee'){ boost=2.8; speed=Math.max(speed,44); timeLeft+=2; coffees++; snd(660,.14,'square',.05,1320); say(pick(LINES.coffee)); }
  else if(o.type==='usb'){ mood=Math.min(100,mood+15); snd(520,.18,'triangle',.07,1040); say(pick(LINES.usb)); }
  else if(o.type==='mail'){
    const kind = Math.random()<.5 ? 'accept' : 'cut';
    power = {kind, t:8};
    if(kind==='accept'){ toast(T.mailAccept[0],T.mailAccept[1]); say(pick(LINES.accept)); car.userData.disco.visible=true;
      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.18,'square',.06),i*110)); }
    else { toast(T.mailCut[0],T.mailCut[1]); say(pick(LINES.cut)); snd(70,.7,'sawtooth',.1,35); flash(); shake=.6; }
    invuln=0;
  }
  idleT=8;
}
function endPower(){ power=null; car.userData.disco.visible=false; say(pick(LINES.powerEnd)); }
function confetti(){
  const cols=[0xffe14d,0xe24a4a,0x4a8be2,0x58d14e,0xffffff];
  for(let i=0;i<70;i++){
    const m=new THREE.Mesh(geo(.3,.3,.3), new THREE.MeshBasicMaterial({color:pick(cols)}));
    m.position.set(carX+rand(-4,4), rand(1,3), -dist-rand(4,12)); scene.add(m);
    fx.push({m, vx:rand(-6,6), vy:rand(8,16), vz:rand(-4,4), life:2.6});
  }
}
function finish(kind){
  if(state!=='play') return;
  BGM.stop();
  if(kind==='win'){ state='arrive'; arriveT=0; confetti(); snd(523,.15,'square',.05); setTimeout(()=>snd(659,.15,'square',.05),150); setTimeout(()=>snd(784,.3,'square',.05),300); say(T.arriveLine); }
  else { state='end'; setTimeout(()=>showResult(kind),900); snd(200,.5,'sawtooth',.06,60); say(kind==='mood'?T.moodEnd:T.timeEnd); }
  $('timer').classList.remove('danger');
}
function showResult(kind){
  state='end'; showPlayUI(false);
  let r;
  if(kind==='win') r = (mood>=75 && timeLeft>=10) ? T.result.best : mood>=40 ? T.result.ok : T.result.meh;
  else r = T.result[kind];
  const score = Math.round((kind==='win'?1000:dist/3) + Math.max(0,timeLeft)*20 + mood*10);
  const best=getBest(); try{ if(score>best) localStorage.setItem('confRaceBest',score); }catch(e){}
  lastResult = {score, cleared:kind==='win', time_left:Math.round(Math.max(0,timeLeft)), mood:Math.round(mood), hits, coffees};
  $('rTitle').textContent=r[0]; $('rQuote').textContent=r[1];
  $('sTimeLbl').textContent = kind==='win' ? T.stat.time : T.stat.dist;
  $('sTime').textContent = kind==='win' ? fmt(timeLeft) : T.unit.dist(Math.round(dist/TOTAL*100));
  $('sMood').textContent = Math.round(mood)+'%'; $('sHits').textContent = T.unit.hits(hits); $('sCoffee').textContent = T.unit.coffee(coffees);
  $('sScore').textContent = score;
  $('sBest').textContent = score>best ? T.newBest : T.best(best);
  $('submitStatus').textContent=''; $('submitBtn').disabled=false; $('submitRow').style.display = SUPA.url ? '' : 'none';
  if(!SUPA.url) $('submitStatus').textContent = T.noSupa;
  try{ const n=localStorage.getItem('confRaceName'); if(n) $('nameIn').value=n; }catch(e){}
  $('result').classList.remove('hidden'); $('againBtn').focus({preventScroll:true});
}

function update(dt){
  if(state==='play'){
    timeLeft -= dt;
    const maxSp = (boost>0 ? 50 : 34 + Math.min(6, dist/500)) + (power ? 8 : 0);
    speed += (maxSp - speed) * Math.min(1, dt*.85);
    if(timeLeft<=0){ timeLeft=0; finish('time'); }
    if(timeLeft<18 && !hurrySaid){ hurrySaid=true; say(pick(LINES.hurry)); idleT=8; BGM.tempo(176); }
    idleT -= dt; if(idleT<=0){ idleT=rand(9,14); say(pick(LINES.idle)); }
    if(power){
      power.t -= dt; if(power.t<=0) endPower();
      else if(power.kind==='accept'){
        car.userData.ball.rotation.y += dt*5;
        for(let i=0;i<3;i++){ const m=new THREE.Mesh(geo(.22,.22,.22), new THREE.MeshBasicMaterial({color:[0xff4a8a,0x4ad0ff,0xffe14d,0x8aff4a,0xffffff][Math.floor(Math.random()*5)]}));
          m.position.set(carX+rand(-6,6), rand(.5,6), -dist+rand(-14,4)); scene.add(m); fx.push({m,vx:rand(-2,2),vy:rand(-1,3),vz:rand(-4,0),life:rand(.4,.9),float:true}); }
      } else {
        for(let i=0;i<4;i++){ const m=new THREE.Mesh(geo(rand(.25,.55),rand(.25,.55),rand(.25,.55)), new THREE.MeshBasicMaterial({color:[0xff3a1a,0xff8a1a,0xffd21a,0x552211][Math.floor(Math.random()*4)]}));
          m.position.set(carX+rand(-1,1), rand(.3,1.2), -dist+rand(1.5,2.5)); scene.add(m); fx.push({m,vx:rand(-3,3),vy:rand(3,9),vz:speed*.5+rand(2,6),life:rand(.3,.6),float:true}); }
      }
    }
  } else if(state==='arrive'){
    speed *= (1 - dt*1.6); arriveT += dt; if(arriveT>2.2) showResult('win');
  } else if(state==='end'){ speed *= (1 - dt*3); }

  dist += speed*dt;
  if(state==='play' && dist>=TOTAL) finish('win');
  const st = stageAt(dist);
  if(state==='play' && st!==stageIdx){ stageIdx=st; toast(T.stages[st].name, T.stages[st].sub); }

  carX += (targetX - carX) * Math.min(1, dt*9);
  car.position.set(carX, Math.abs(Math.sin(t*14))*.05*(speed/34), -dist);
  const yaw = clamp((carX - targetX)*.14, -.42, .42);
  car.rotation.y += (yaw - car.rotation.y)*Math.min(1,dt*10);
  car.rotation.z = -car.rotation.y*.25;
  invuln -= dt; boost -= dt;
  car.visible = invuln<=0 || Math.floor(t*14)%2===0;

  const cz = -dist;
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i], m=o.mesh; o.t+=dt;
    if(o.fly){ m.position.x+=o.fly.vx*dt; m.position.y+=o.fly.vy*dt; m.position.z+=o.fly.vz*dt; o.fly.vy-=30*dt;
      m.rotation.x+=o.fly.rx*dt; m.rotation.z+=o.fly.rz*dt;
      if(o.t>1.8){ scene.remove(m); obstacles.splice(i,1); } continue; }
    if(o.collected){ m.scale.multiplyScalar(1+dt*5); m.position.y+=dt*8; if(o.t>.35){ scene.remove(m); obstacles.splice(i,1); } continue; }
    if(o.type==='goose'){
      m.position.x+=o.vx*dt; if(Math.abs(m.position.x)>6.4){ o.vx*=-1; m.position.x=clamp(m.position.x,-6.4,6.4); m.rotation.y=o.vx>0?-Math.PI/2:Math.PI/2; }
      o.body.position.y=Math.abs(Math.sin(o.t*11))*.18; o.body.rotation.z=Math.sin(o.t*11)*.12;
      if(!o.honked && Math.abs(m.position.z-cz)<32 && state==='play'){ o.honked=true; if(Math.random()<.6) honk(); }
    } else if(o.type==='reviewer'){
      m.position.x+=o.vx*dt; if(Math.abs(m.position.x)>5.4) o.vx*=-1; m.position.y=Math.abs(Math.sin(o.t*8))*.12;
    } else if(o.type==='dewar'){
      m.position.z+=o.vz*dt; o.body.rotation.z=Math.sin(o.t*9)*.14;
      o.puffs.forEach(p=>{ const k=((o.t+p.userData.o)%1.2)/1.2; p.position.y=2.1+k*1.6; p.material.opacity=.7*(1-k); p.scale.setScalar(.6+k*1.4); });
    } else if(o.type==='squirrel'){
      m.position.x+=o.vx*dt; if(Math.abs(m.position.x)>6.4){ o.vx*=-1; m.position.x=clamp(m.position.x,-6.4,6.4); m.rotation.y=o.vx>0?-Math.PI/2:Math.PI/2; }
      o.body.position.y=Math.abs(Math.sin(o.t*16))*.35;
    } else if(o.type==='cat'){
      if(Math.sin(o.t*1.3+o.phase) > .2){ m.position.x+=o.vx*dt; if(Math.abs(m.position.x)>5.2){ o.vx*=-1; m.rotation.y=o.vx>0?-Math.PI/2:Math.PI/2; } o.body.position.y=Math.abs(Math.sin(o.t*9))*.06; }
      o.tail.rotation.x = Math.sin(o.t*3)*.5;
    } else if(o.type==='chair'){
      m.position.x+=o.vx*dt; if(Math.abs(m.position.x)>5.2) o.vx*=-1; m.position.y=Math.abs(Math.sin(o.t*5))*.06;
    } else if(o.pickup){ o.body.rotation.y+=dt*2.6; o.body.position.y=(o.type==='mail'?1.4:1.3)+Math.sin(o.t*4)*.2; if(o.glow) o.glow.material.opacity=.5+Math.sin(o.t*8)*.3; }

    if(state==='play' || state==='arrive'){
      const ox = m.position.x + (o.cx||0);
      const reach = power && power.kind==='cut' && !o.pickup ? 1.6 : 0;
      if(Math.abs(ox-carX) < o.hw+1.05+reach && Math.abs(m.position.z-cz) < o.hd+1.75+reach){
        if(o.pickup) collect(o); else if(power && state==='play') smash(o); else if(invuln<=0 && state==='play') hitObs(o);
      }
    }
    if(m.position.z > cz + 22){ scene.remove(m); obstacles.splice(i,1); }
  }
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life-=dt; f.m.position.x+=f.vx*dt; f.m.position.y+=f.vy*dt; f.m.position.z+=f.vz*dt; if(!f.float) f.vy-=18*dt; f.m.rotation.x+=dt*6; f.m.rotation.y+=dt*5;
    if(f.float){ f.m.scale.setScalar(Math.max(.05,f.life*2)); }
    else if(f.m.position.y<.15){ f.m.position.y=.15; f.vy*=-.3; f.vx*=.7; f.vz*=.7; }
    if(f.life<=0){ scene.remove(f.m); fx.splice(i,1); } }

  shake = Math.max(0, shake - dt);
  streamWorld(); setSky(); updateHUD();
}

function updateCamera(dt){
  const a=camera.aspect, p=clamp((1.3-a)/.85,0,1);
  const offY=6.6+3.4*p, offZ=11+3.2*p;
  const targetFov = fovBase + (boost>0 && state==='play' ? 7 : 0);
  if(Math.abs(camera.fov-targetFov)>.05){ camera.fov += (targetFov-camera.fov)*Math.min(1,dt*6); camera.updateProjectionMatrix(); }
  const sx = shake>0 ? (Math.random()-.5)*shake*.9 : 0, sy = shake>0 ? (Math.random()-.5)*shake*.6 : 0;
  camera.position.set(carX*.6 + sx, offY + sy, -dist + offZ);
  camera.lookAt(carX*.8, 1.2, -dist - 14);
}
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  const p=clamp((1.3-camera.aspect)/.85,0,1);
  fovBase = 58 + 17*p; camera.fov = fovBase;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}

/* ================= RANKING (Supabase REST) ================= */
const supaHeaders = () => ({'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key,'Content-Type':'application/json'});
async function fetchTop(){
  const q = SUPA.url+'/rest/v1/'+SUPA.table+'?select=name,score,cleared,time_left,mood,lang&order=cleared.desc,score.desc&limit=20';
  const res = await fetch(q,{headers:supaHeaders()}); if(!res.ok) throw new Error('fetch'); return res.json();
}
async function submitScore(){
  if(!lastResult || submitted) return;
  let name = $('nameIn').value.trim().slice(0,12);
  if(!name){ $('nameIn').focus(); return; }
  try{ localStorage.setItem('confRaceName',name); }catch(e){}
  $('submitBtn').disabled=true; $('submitStatus').textContent=T.sending;
  try{
    const body = Object.assign({name, lang:LANG, version:VERSION}, lastResult);
    const res = await fetch(SUPA.url+'/rest/v1/'+SUPA.table,{method:'POST',headers:Object.assign(supaHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(body)});
    if(!res.ok) throw new Error('insert');
    submitted=true;
    const count = async (filter)=>{ const r=await fetch(SUPA.url+'/rest/v1/'+SUPA.table+'?select=id&'+filter+'&limit=1',{headers:Object.assign(supaHeaders(),{'Prefer':'count=exact','Range':'0-0'})}); const cr=r.headers.get('content-range'); return (cr&&cr.includes('/')) ? +cr.split('/')[1] : NaN; };
    let above = await count('cleared=eq.'+lastResult.cleared+'&score=gt.'+lastResult.score);
    if(!lastResult.cleared) above += await count('cleared=eq.true');
    $('submitStatus').textContent = T.sent(isNaN(above)?'?':above+1);
  }catch(e){ $('submitStatus').textContent=T.sendFail; $('submitBtn').disabled=false; }
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function openRank(){
  $('rank').classList.remove('hidden');
  const body=$('lbBody');
  if(!SUPA.url){ body.innerHTML='<div class="empty">'+esc(T.noSupa)+'</div>'; return; }
  body.innerHTML='<div class="empty">'+esc(T.lbLoading)+'</div>';
  try{
    const rows = await fetchTop();
    if(!rows.length){ body.innerHTML='<div class="empty">'+esc(T.lbEmpty)+'</div>'; return; }
    let myName=''; try{ myName=localStorage.getItem('confRaceName')||''; }catch(e){}
    body.innerHTML='<table>'+rows.map((r,i)=>'<tr'+(r.name===myName?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(r.name)+'<span class="tag'+(r.cleared?'':' f')+'">'+(r.cleared?esc(T.tagWin)+' '+fmt(r.time_left):esc(T.tagFail))+'</span></td><td class="r">'+r.score+'</td></tr>').join('')+'</table>';
  }catch(e){ body.innerHTML='<div class="empty">'+esc(T.lbFail)+'</div>'; }
}

/* ================= INPUT ================= */
let dragging=false, dragX0=0, target0=0;
function pDown(e){ if(state!=='play') return; dragging=true; dragX0=e.clientX; target0=targetX; }
function pMove(e){ if(!dragging || state!=='play') return; const w=Math.min(innerWidth, 700); targetX = clamp(target0 + (e.clientX-dragX0)/w*15, -CAR_LIMIT, CAR_LIMIT); }
function pUp(){ dragging=false; }
const keys={};
addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; keys[e.key]=true; if((e.key==='Enter'||e.key===' ') && state==='title'){ e.preventDefault(); start(); } if(e.key==='Escape'){ if(state==='play') pauseGame(); else if(state==='pause') resumeGame(); } });
addEventListener('keyup', e=>{ keys[e.key]=false; });

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
  if(state==='play'){ const k=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0); if(k) targetX=clamp(targetX+k*dt*11,-CAR_LIMIT,CAR_LIMIT); }
  if(state==='title'){ car.position.y=Math.abs(Math.sin(t*3))*.04; streamWorld(); }
  else if(state!=='pause') update(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}

function boot(){
  applyText();
  initScene(); reset();
  const el=renderer.domElement;
  el.addEventListener('pointerdown', pDown); addEventListener('pointermove', pMove);
  addEventListener('pointerup', pUp); addEventListener('pointercancel', pUp);
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('rankBtn').addEventListener('click', openRank); $('rankBtn2').addEventListener('click', openRank);
  $('lbClose').addEventListener('click', ()=>$('rank').classList.add('hidden'));
  $('submitBtn').addEventListener('click', submitScore);
  $('nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter') submitScore(); });
  $('langBtn').addEventListener('click', ()=>{ const u=new URL(location.href); if(LANG==='ko') u.searchParams.set('lang','en'); else u.searchParams.delete('lang'); location.href=u.toString(); });
  $('pause').addEventListener('click', pauseGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('quitBtn').addEventListener('click', quitGame);
  $('rankBtn3').addEventListener('click', openRank);
  $('soundBtn').addEventListener('click', ()=>{ muted=!muted; BGM.mute(muted); syncSound(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='play') pauseGame(); });
  const b=getBest(); if(b) $('bestT').textContent=T.bestT(b);
  $('startBtn').focus({preventScroll:true});
  requestAnimationFrame(loop);
}
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('40px "Do Hyeon"').catch(()=>{}) : Promise.resolve();
Promise.race([fontReady, new Promise(r=>setTimeout(r,1500))]).then(boot);
})();
</script>
